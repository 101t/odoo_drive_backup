    <title>Odoo Backup</title>
    <script>
      try {
        var t = localStorage.getItem("odb-theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
