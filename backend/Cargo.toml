[package]
name = "odoo-backup"
description = "Automated backup manager for Odoo instances (Google Drive, local storage)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "odoo-backup"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
croner = "4"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
md-5 = "0.11"
mime_guess = "2"
reqwest = { version = "0.13", features = ["json", "stream", "multipart", "form", "query"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls-aws-lc-rs", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
dotenvy = "0.15"
tracing-appender = "0.2"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The static Linux release builds (musl) use mimalloc: musl's allocator is slow under concurrent load.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
