name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Pull requests: a newer push cancels the running check. main and tags: runs queue, so images are pushed in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/odoo-backup

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # The binary reports CARGO_PKG_VERSION (--version, /api/health), so a release tag must match Cargo.toml.
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  backend:
    name: Backend (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    services:
      # Lets the db tests also run on PostgreSQL (they are skipped without ODB_TEST_POSTGRES_URL).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99" # keep in step with the rust image in the Dockerfile
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -p odoo-backup
        env:
          ODB_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

  frontend:
    name: Frontend (type-check)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  image:
    name: Docker image
    needs: [version, backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Tag v0.0.1 -> 0.0.1, 0.0 and latest (plus the major once it is 1 or higher); main -> edge; any push -> sha-<commit>.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=odoo-backup

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: odoo-backup:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run -d --name odoo-backup -p 8080:8080 odoo-backup:ci
          body=""
          for _ in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8080/api/health) && break
            sleep 1
          done
          docker logs odoo-backup
          echo "health: $body"
          if [[ "$(jq -r .version <<<"$body")" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Container did not report version $EXPECTED_VERSION on /api/health"
            exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as Build, so every layer comes from the builder's cache.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  bundles:
    name: Server bundles
    needs: [version, backend, frontend]
    uses: ./.github/workflows/bundles.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Tags only: publishes the bundles, install.sh and SHA256SUMS as a GitHub release, with build provenance
  # (verify a download with: gh attestation verify <file> --repo <owner>/<repo>).
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, bundles]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp packaging/linux/install.sh dist/
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Odoo Backup ${GITHUB_REF_NAME#v}" --generate-notes
